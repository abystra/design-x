name: E2B Runner template candidate
on:
  workflow_dispatch:
jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: runtime/matfs/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2'
      - run: python -m pytest runtime/runner/tests -q
      - name: Verify pinned source digests
        run: python runtime/verify-provenance.py
      - name: Build fixed Codex and matfs template
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: node --import tsx infra/e2b/build.ts
      - name: Verify FUSE and the root execution boundary without model calls
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: node --import tsx infra/e2b/kernel-smoke.ts
      - uses: actions/upload-artifact@v4
        with:
          name: designx-e2b-candidate-${{ github.sha }}
          path: |
            infra/e2b/dist/build.json
            runtime/provenance.json
            runtime/matfs/dist/provenance.json
            artifacts/v2/e2b-fuse-kernel.json
          retention-days: 90
